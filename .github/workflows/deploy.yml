
name: Deploy Nginx to AWS

'on':
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo git clone https://github.com/pjpangilinan/devops-nginx-pipeline.git /var/www/html/
            sudo docker stop my-devops-nginx || true
            sudo docker rm my-devops-nginx || true
            sudo docker run -d --name my-devops-nginx -p 80:80 -v /var/www/html/:/usr/share/nginx/html nginx
